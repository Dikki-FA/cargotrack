$kind: http-request
description: |
  PDF memuat QR/Barcode dari `tracking_number`, data pengirim & penerima,
  berat, jenis barang, dan biaya. Akses mengikuti aturan role yang sama
  dengan daftar shipment.
url: "{{baseUrl}}/shipments/:id/label"
method: GET
headers:
  Accept: application/pdf
pathVariables:
  - key: id
    value: "1"
    disabled: false
    description: ID shipment (bukan nomor resi)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Unduh label resi (PDF A6, 100x150 mm).resources/examples
order: 1000
