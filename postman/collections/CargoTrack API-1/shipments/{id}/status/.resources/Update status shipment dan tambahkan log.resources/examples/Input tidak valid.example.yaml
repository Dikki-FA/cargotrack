$kind: http-example
request:
  url: "{{baseUrl}}/shipments/:id/status"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "1"
      disabled: false
      description: ID shipment (bukan nomor resi)
  body:
    type: json
    content: |-
      {
        "status": "in_transit",
        "location_description": "Gudang Jakarta Timur",
        "notes": "Diberangkatkan ke Bandung"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The given data was invalid.",
        "errors": {
          "weight_kg": [
            "The weight kg field is required."
          ]
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string",
            "example": "The given data was invalid."
          },
          "errors": {
            "type": "object",
            "example": {
              "weight_kg": [
                "The weight kg field is required."
              ]
            }
          }
        }
      }
order: 5000
