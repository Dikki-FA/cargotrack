$kind: http-example
request:
  url: "{{baseUrl}}/shipments/:id/status"
  method: PATCH
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "1"
      disabled: false
      description: ID shipment (bukan nomor resi)
  body:
    type: json
    content: |-
      {
        "status": "in_transit",
        "location_description": "Gudang Jakarta Timur",
        "notes": "Diberangkatkan ke Bandung"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Unauthenticated."
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        }
      }
order: 2000
