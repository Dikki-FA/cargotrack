$kind: http-request
description: |
  Hasil otomatis dibatasi sesuai role:
  `admin` melihat semua, `warehouse_staff` hanya shipment di gudangnya,
  `courier` hanya shipment yang ditugaskan kepadanya.
url: "{{baseUrl}}/shipments?search=string&status=delivered&page=1&per_page=15"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: search
    value: string
    disabled: false
    description: Cari berdasarkan nomor resi, nama pengirim, atau nama penerima
    $type: string
  - key: status
    value: delivered
    disabled: false
    description: Filter berdasarkan status saat ini
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "enum": [
              "pending",
              "received_at_warehouse",
              "in_transit",
              "out_for_delivery",
              "delivered",
              "failed"
            ]
          }
        }
      }
  - key: page
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1,
            "minimum": 1
          }
        }
      }
  - key: per_page
    value: "15"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 15,
            "minimum": 1,
            "maximum": 100
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Daftar shipment (filter, search, pagination).resources/examples
order: 1000
