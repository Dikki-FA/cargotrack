$kind: http-example
request:
  url: "{{baseUrl}}/shipments/estimate"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "origin_city": "Jakarta",
        "destination_city": "Bandung",
        "weight_kg": 2.5
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "data": {
          "base_fee": 10000,
          "rate_per_kg": 5000,
          "weight_cost": 12500,
          "intercity_surcharge": 5000,
          "total_cost": 27500
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "data": {
            "type": "object",
            "example": {
              "base_fee": 10000,
              "rate_per_kg": 5000,
              "weight_cost": 12500,
              "intercity_surcharge": 5000,
              "total_cost": 27500
            },
            "properties": {
              "base_fee": {
                "type": "number"
              },
              "rate_per_kg": {
                "type": "number"
              },
              "weight_cost": {
                "type": "number",
                "description": "weight_kg x rate_per_kg"
              },
              "intercity_surcharge": {
                "type": "number"
              },
              "total_cost": {
                "type": "number"
              }
            }
          }
        }
      }
order: 1000
