$kind: http-example
request:
  url: "{{baseUrl}}/shipments/:id/label"
  method: GET
  headers:
    - key: Accept
      value: application/pdf
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    - key: id
      value: "1"
      disabled: false
      description: ID shipment (bukan nomor resi)
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/pdf
  body:
    type: text
    content: string
    $type: |-
      {
        "type": "string",
        "format": "binary"
      }
order: 1000
