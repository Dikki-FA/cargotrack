$kind: http-request
description: |
  Setiap update membuat satu baris baru di `shipment_logs`, memicu event
  broadcast `ShipmentStatusUpdated`, dan (jika `delivered`) mengantrekan
  notifikasi email.

  Batasan per role:
  - `admin`: semua status.
  - `warehouse_staff`: hanya `received_at_warehouse`, `in_transit`, dan hanya untuk shipment di gudangnya.
  - `courier`: hanya `out_for_delivery`, `delivered`, dan hanya untuk shipment yang ditugaskan kepadanya.

  Pelanggaran batasan menghasilkan `403`.
url: "{{baseUrl}}/shipments/:id/status"
method: PATCH
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: id
    value: "1"
    disabled: false
    description: ID shipment (bukan nomor resi)
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "status": "in_transit",
      "location_description": "Gudang Jakarta Timur",
      "notes": "Diberangkatkan ke Bandung"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "status": {
          "type": "string",
          "enum": [
            "pending",
            "received_at_warehouse",
            "in_transit",
            "out_for_delivery",
            "delivered",
            "failed"
          ]
        },
        "location_description": {
          "type": "string",
          "maxLength": 255
        },
        "notes": {
          "type": "string"
        }
      },
      "required": [
        "status"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Update status shipment dan tambahkan log.resources/examples
order: 1000
