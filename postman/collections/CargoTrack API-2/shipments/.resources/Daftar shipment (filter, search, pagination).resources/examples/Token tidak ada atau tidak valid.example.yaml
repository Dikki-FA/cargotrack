$kind: http-example
request:
  url: "{{baseUrl}}/shipments?search=string&status=out_for_delivery&page=1&per_page=15"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: search
      value: string
      disabled: false
      description: Cari berdasarkan nomor resi, nama pengirim, atau nama penerima
    - key: status
      value: out_for_delivery
      disabled: false
      description: Filter berdasarkan status saat ini
    - key: page
      value: "1"
      disabled: false
      description: ""
    - key: per_page
      value: "15"
      disabled: false
      description: ""
  body:
    type: text
    content: ""
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "Unauthenticated."
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        }
      }
order: 2000
