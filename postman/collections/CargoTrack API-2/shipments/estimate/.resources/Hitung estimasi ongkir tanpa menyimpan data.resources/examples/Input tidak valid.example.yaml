$kind: http-example
request:
  url: "{{baseUrl}}/shipments/estimate"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "origin_city": "Jakarta",
        "destination_city": "Bandung",
        "weight_kg": 2.5
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "The given data was invalid.",
        "errors": {
          "weight_kg": [
            "The weight kg field is required."
          ]
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string",
            "example": "The given data was invalid."
          },
          "errors": {
            "type": "object",
            "example": {
              "weight_kg": [
                "The weight kg field is required."
              ]
            }
          }
        }
      }
order: 3000
